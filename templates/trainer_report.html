<!DOCTYPE html>
<html>
<head><title>Trainer Report</title></head>
<body>
    <h2>Trainer Course details</h2>
    
    <form method="post" action="{{ url_for('trainer_filter') }}">
        <label>Course: </label>
        <select name="course" required>
            <option value="All">All</option>
            <option value="DevOps Advancement Track">DevOps Advancement Track</option>
            <option value="Linux">Linux</option>
            <option value="AI">AI</option>
            <option value="Python">Python</option>
        </select>
        <input type="submit" value="Search">
    </form>
    <br>

    <table border="2">
        <tr>
            <th>Sr.no</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Designation</th>
            <th>Course</th>
        </tr>
        {% for row in output_data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
